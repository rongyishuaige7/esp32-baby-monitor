<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">基于ESP32的婴儿状态监测原型：源码推导接线边界图</title>
  <desc id="desc">展示 ESP32 与两路 HC-SR04、DHT11、声音输入、RGB LED、蜂鸣器、按钮的源码引脚对应关系；明确 HC-SR04 ECHO 需经电平转换，按钮、LED、蜂鸣器的电气细节待实物确认。</desc>
  <style>
    .bg{fill:#fffaf5}.panel{fill:#ffffff;stroke:#f97316;stroke-width:2}.peripheral{fill:#fff1e6;stroke:#c2410c;stroke-width:2}.warning{fill:#fff7d6;stroke:#b45309;stroke-width:2}.line{stroke:#9a3412;stroke-width:3;fill:none}.dash{stroke:#b45309;stroke-width:3;stroke-dasharray:8 8;fill:none}.t{font-family:Arial,"Noto Sans SC",sans-serif;fill:#431407}.h{font-weight:700;font-size:26px}.s{font-size:18px}.xs{font-size:15px}.w{font-weight:700;fill:#92400e}
  </style>
  <rect class="bg" width="1200" height="800"/>
  <text x="60" y="58" class="t h">源码推导接线边界图（不是原理图、PCB 或真机证明）</text>
  <text x="60" y="88" class="t xs">所有电压、电流、电平、限流、驱动、上拉/下拉和公共地必须按实物复核；不得用于安全或医疗用途。</text>

  <rect x="460" y="145" width="300" height="500" rx="18" class="panel"/>
  <text x="610" y="188" text-anchor="middle" class="t h">ESP32</text>
  <text x="490" y="230" class="t s">GPIO5  · TOP TRIG</text>
  <text x="490" y="262" class="t s">GPIO18 · TOP ECHO</text>
  <text x="490" y="294" class="t s">GPIO19 · SIDE TRIG</text>
  <text x="490" y="326" class="t s">GPIO21 · SIDE ECHO</text>
  <text x="490" y="370" class="t s">GPIO4  · DHT11 DATA</text>
  <text x="490" y="402" class="t s">GPIO34 · SOUND AO</text>
  <text x="490" y="446" class="t s">GPIO25 / 27 / 26 · RGB</text>
  <text x="490" y="478" class="t s">GPIO2 · BUZZER</text>
  <text x="490" y="522" class="t s">GPIO22 · STATUS BUTTON</text>
  <text x="490" y="554" class="t s">GPIO23 · MUTE BUTTON</text>
  <text x="490" y="606" class="t xs">代码假设 RGB/蜂鸣器低电平触发；</text>
  <text x="490" y="628" class="t xs">实际极性和驱动待真机确认。</text>

  <rect x="55" y="150" width="285" height="105" rx="14" class="peripheral"/>
  <text x="197" y="188" text-anchor="middle" class="t h">HC-SR04 #1</text>
  <text x="197" y="219" text-anchor="middle" class="t s">TRIG → GPIO5</text>
  <text x="197" y="244" text-anchor="middle" class="t w xs">ECHO（常见 5 V）不可直连</text>
  <rect x="55" y="305" width="285" height="105" rx="14" class="peripheral"/>
  <text x="197" y="343" text-anchor="middle" class="t h">HC-SR04 #2</text>
  <text x="197" y="374" text-anchor="middle" class="t s">TRIG → GPIO19</text>
  <text x="197" y="399" text-anchor="middle" class="t w xs">ECHO（常见 5 V）不可直连</text>
  <rect x="55" y="470" width="285" height="88" rx="14" class="peripheral"/>
  <text x="197" y="508" text-anchor="middle" class="t h">DHT11</text>
  <text x="197" y="537" text-anchor="middle" class="t s">DATA → GPIO4（供电/上拉待确认）</text>
  <rect x="55" y="605" width="285" height="88" rx="14" class="peripheral"/>
  <text x="197" y="643" text-anchor="middle" class="t h">模拟声音模块</text>
  <text x="197" y="672" text-anchor="middle" class="t s">AO → GPIO34（ADC 电压待确认）</text>

  <rect x="860" y="150" width="285" height="92" rx="14" class="peripheral"/>
  <text x="1002" y="188" text-anchor="middle" class="t h">RGB LED / 模块</text>
  <text x="1002" y="217" text-anchor="middle" class="t s">R/G/B → GPIO25/27/26</text>
  <rect x="860" y="294" width="285" height="92" rx="14" class="peripheral"/>
  <text x="1002" y="332" text-anchor="middle" class="t h">蜂鸣器 / 驱动</text>
  <text x="1002" y="361" text-anchor="middle" class="t s">信号 → GPIO2</text>
  <rect x="860" y="438" width="285" height="105" rx="14" class="peripheral"/>
  <text x="1002" y="476" text-anchor="middle" class="t h">查询按钮</text>
  <text x="1002" y="505" text-anchor="middle" class="t s">GPIO22 · 外部上拉/下拉待确认</text>
  <text x="1002" y="528" text-anchor="middle" class="t xs">当前代码预期按下为 HIGH</text>
  <rect x="860" y="590" width="285" height="105" rx="14" class="peripheral"/>
  <text x="1002" y="628" text-anchor="middle" class="t h">静音切换按钮</text>
  <text x="1002" y="657" text-anchor="middle" class="t s">GPIO23 · 外部上拉/下拉待确认</text>
  <text x="1002" y="680" text-anchor="middle" class="t xs">当前代码预期按下为 HIGH</text>

  <path d="M340 198 H460" class="line"/><path d="M340 353 H460" class="line"/>
  <path d="M340 514 H460" class="line"/><path d="M340 649 H460" class="line"/>
  <path d="M760 196 H860" class="line"/><path d="M760 340 H860" class="line"/>
  <path d="M760 491 H860" class="line"/><path d="M760 643 H860" class="line"/>
  <rect x="95" y="265" width="205" height="28" rx="6" class="warning"/><text x="197" y="285" text-anchor="middle" class="t w xs">分压/电平转换 → GPIO18</text>
  <rect x="95" y="420" width="205" height="28" rx="6" class="warning"/><text x="197" y="440" text-anchor="middle" class="t w xs">分压/电平转换 → GPIO21</text>
  <path d="M300 279 H398 V262 H460" class="dash"/><path d="M300 434 H420 V326 H460" class="dash"/>
</svg>
