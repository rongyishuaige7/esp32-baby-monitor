name: Validate ESP32 Demonstration Sensor Prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32-baby-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-and-build:
    name: Publication contracts and firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up PlatformIO Core
        run: python3 -m pip install --disable-pip-version-check platformio==6.1.19

      - name: Run publication and source-contract gates
        run: |
          python3 scripts/secret_scan.py
          python3 scripts/check_repo.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build ESP32 firmware
        run: pio run

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32dev-firmware
          path: .pio/build/esp32dev/firmware.bin
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
